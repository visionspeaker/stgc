<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>오직 확대 시험</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,'Malgun Gothic',system-ui,sans-serif;background:#f5f7fb;color:#26313f}
.bar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #dde4ee;padding:8px 10px}
.t{font-size:13px;font-weight:800;margin-bottom:6px}
.t small{font-weight:400;color:#6b7686}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns button,.btns a{border:0;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:800;background:#eef2f7;color:#26313f;text-decoration:none;font-family:inherit}
.btns .on{background:linear-gradient(135deg,#57b45f,#2fa58f);color:#fff}
.btns a{background:#eaf1fb;color:#1d4ed8}
.wrap{height:calc(100% - 92px)}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.note{font-size:11.5px;color:#6b7686;margin-top:6px;line-height:1.5}
</style></head><body>
<div class="bar">
  <div class="t">오직 확대 시험 <small>· 영광 커넥트 안에 띄운 화면</small></div>
  <div class="btns">
    <button id="b1" class="on" onclick="go(1)">오직</button>
    <button id="b2" onclick="go(2)">헌금확인</button>
    <a id="ext" href="https://mas3.ohjic.com/member/home/igloria1" target="_blank" rel="noopener">새 창으로 ↗</a>
  </div>
  <div class="note">① 두 손가락으로 벌려 확대되는지 ② 헌금확인에서 로그인 후 내역이 보이는지 확인해 주세요.</div>
</div>
<div class="wrap"><iframe id="f" src="https://mas3.ohjic.com/member/home/igloria1" title="오직"></iframe></div>
<script>
var U={1:'https://mas3.ohjic.com/member/home/igloria1',2:'https://mas3.ohjic.com/pages/donation/donation_list/igloria1'};
function go(n){
  document.getElementById('f').src=U[n];
  document.getElementById('ext').href=U[n];
  document.getElementById('b1').className=n===1?'on':'';
  document.getElementById('b2').className=n===2?'on':'';
}
</script>
</body></html>
